name: CI/CD Pipeline
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow runs
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run:
          if [ -n "$API_KEY" ]; then
            echo "The secret exists."
          else
            echo "The secret does not exist."
            exit 1
          fi
